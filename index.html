<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Games Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 54%, #bbf7d0 54%, #86efac 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Decorative Floating Clouds */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            z-index: 0;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud-1 { width: 130px; height: 42px; top: 6%; left: -160px; animation-duration: 38s; }
        .cloud-1::before { width: 54px; height: 54px; top: -26px; left: 16px; }
        .cloud-1::after { width: 74px; height: 74px; top: -36px; right: 16px; }

        .cloud-2 { width: 165px; height: 50px; top: 16%; left: -210px; animation-duration: 52s; animation-delay: 8s; }
        .cloud-2::before { width: 66px; height: 66px; top: -30px; left: 26px; }
        .cloud-2::after { width: 84px; height: 84px; top: -40px; right: 22px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 260px)); }
        }

        /* Main Launcher Card */
        .hub-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 36px;
            border: 6px solid #ffffff;
            box-shadow: 0 18px 36px -6px rgba(2, 132, 199, 0.22), 0 8px 14px -6px rgba(0, 0, 0, 0.08);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .hub-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .hub-title {
            font-size: clamp(1.5rem, 5vw, 2.3rem);
            font-weight: 900;
            color: #0369a1;
            text-align: left;
        }

        .rotate-btn {
            background: #e0f2fe;
            border: 3px solid #7dd3fc;
            border-radius: 50%;
            width: 46px;
            height: 46px;
            font-size: 1.35rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s ease, background 0.2s;
        }

        .rotate-btn:hover {
            background: #bae6fd;
            transform: rotate(90deg) scale(1.06);
        }

        /* Landscape Lock Fallback for Mobile Portrait */
        body.force-landscape {
            padding: 0;
            overflow: hidden;
        }
        body.force-landscape .hub-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            max-width: 100vh;
            height: 100vw;
            max-height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            border-radius: 0;
            overflow-y: auto;
            padding: 16px 24px;
            gap: 12px;
        }

        /* 5 Game Buttons List */
        .games-list {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 640px) {
            .games-list {
                grid-template-columns: repeat(2, 1fr);
            }
            .games-list .game-btn:last-child {
                grid-column: 1 / -1;
            }
        }

        .game-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 24px;
            text-decoration: none;
            font-size: clamp(1.05rem, 3.4vw, 1.35rem);
            font-weight: 900;
            color: #ffffff;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .game-btn:hover {
            transform: translateY(-4px) scale(1.015);
            filter: brightness(1.04);
        }

        .game-btn:active {
            transform: translateY(3px);
        }

        .game-icon {
            font-size: 2.3rem;
            line-height: 1;
            flex-shrink: 0;
        }

        /* Individual Vibrant Toy Button Colors */
        .btn-addition {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 4px solid #bae6fd;
            box-shadow: 0 7px 0 #0369a1;
        }

        .btn-monster {
            background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
            border: 4px solid #f3e8ff;
            box-shadow: 0 7px 0 #581c87;
        }

        .btn-rocket {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border: 4px solid #dbeafe;
            box-shadow: 0 7px 0 #1e3a8a;
        }

        .btn-balance {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border: 4px solid #fef3c7;
            box-shadow: 0 7px 0 #92400e;
            color: #451a03;
        }

        .btn-train {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border: 4px solid #fee2e2;
            box-shadow: 0 7px 0 #991b1b;
        }
    </style>
</head>
<body>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <main class="hub-container">
        <div class="hub-header">
            <h1 class="hub-title">🎮 Pick a Game!</h1>
            <button class="rotate-btn" id="rotate-btn" onclick="toggleLandscapeMode()" title="Rotate Screen" aria-label="Rotate Screen">🔄</button>
        </div>

        <nav class="games-list" aria-label="Games Menu">
            <a href="addition_game.html" class="game-btn btn-addition">
                <span class="game-icon">➕</span>
                <span>Math Adventure: Addition</span>
            </a>

            <a href="hungry_monster_subtraction.html" class="game-btn btn-monster">
                <span class="game-icon">👾</span>
                <span>Hungry Monster Subtraction</span>
            </a>

            <a href="rocket_place_value.html" class="game-btn btn-rocket">
                <span class="game-icon">🚀</span>
                <span>Rocket Place-Value Builder</span>
            </a>

            <a href="balance_beam_scale.html" class="game-btn btn-balance">
                <span class="game-icon">⚖️</span>
                <span>Balance Beam Scale</span>
            </a>

            <a href="word_builder_train.html" class="game-btn btn-train">
                <span class="game-icon">🚂</span>
                <span>Word Builder Train</span>
            </a>
        </nav>
    </main>

    <script>
        async function toggleLandscapeMode() {
            const isForced = document.body.classList.contains('force-landscape');
            if (!isForced) {
                try {
                    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                        return;
                    }
                } catch (err) {
                    // Fallback to CSS 90-degree landscape rotation on mobile browsers
                }
                document.body.classList.add('force-landscape');
            } else {
                document.body.classList.remove('force-landscape');
                try {
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                    if (document.fullscreenElement && document.exitFullscreen) {
                        await document.exitFullscreen();
                    }
                } catch (err) {}
            }
        }
    </script>
</body>
</html>
