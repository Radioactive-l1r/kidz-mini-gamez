<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Builder Train</title>
    <style>
        :root {
            --sky-top: #bae6fd;
            --sky-bottom: #e0f2fe;
            --grass-top: #bbf7d0;
            --grass-bottom: #86efac;
            --card-bg: #ffffff;
            --train-red: #ef4444;
            --train-red-dark: #b91c1c;
            --train-blue: #0284c7;
            --train-blue-dark: #0369a1;
            --accent-amber: #f59e0b;
            --accent-amber-dark: #b45309;
            --success-green: #22c55e;
            --success-green-dark: #15803d;
            --error-red: #f87171;
            --error-red-dark: #dc2626;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --shadow-soft: 0 16px 34px -6px rgba(2, 132, 199, 0.2), 0 8px 14px -6px rgba(0, 0, 0, 0.08);
            --shadow-btn: 0 7px 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 54%, var(--grass-top) 54%, var(--grass-bottom) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            overflow-x: hidden;
            padding: 16px;
        }

        /* Decorative Floating Clouds */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            z-index: 0;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }
        .cloud-1 { width: 130px; height: 42px; top: 5%; left: -160px; animation-duration: 38s; }
        .cloud-1::before { width: 54px; height: 54px; top: -26px; left: 16px; }
        .cloud-1::after { width: 74px; height: 74px; top: -36px; right: 16px; }

        .cloud-2 { width: 165px; height: 50px; top: 15%; left: -210px; animation-duration: 52s; animation-delay: 8s; }
        .cloud-2::before { width: 66px; height: 66px; top: -30px; left: 26px; }
        .cloud-2::after { width: 84px; height: 84px; top: -40px; right: 22px; }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 260px)); }
        }

        /* =========================================
           MAIN CENTERED GAME CARD
           ========================================= */
        .game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            border-radius: 34px;
            box-shadow: var(--shadow-soft);
            border: 6px solid #ffffff;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header Bar */
        .header-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 10px;
            border-bottom: 3px dashed #e2e8f0;
        }

        .mode-selector {
            display: flex;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 20px;
            gap: 6px;
        }

        .mode-btn {
            border: none;
            padding: 9px 16px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--train-red);
            color: #ffffff;
            box-shadow: 0 4px 0 var(--train-red-dark);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fef9c3;
            border: 2px solid #fde047;
            padding: 7px 14px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #854d0e;
        }

        .streak-badge {
            background: #fee2e2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        .icon-btn {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s;
        }

        .icon-btn:hover {
            background: #e2e8f0;
            transform: scale(1.06);
        }

        /* Mobile Responsive & Rotate Landscape Mode */
        @media (max-width: 580px) {
            body { padding: 8px; }
            .game-container { padding: 14px 10px; border-radius: 24px; gap: 10px; }
            .mode-btn { padding: 7px 12px; font-size: 0.9rem; }
            .stat-badge { padding: 5px 10px; font-size: 0.95rem; }
            .icon-btn { width: 38px; height: 38px; font-size: 1.15rem; }
            .station-arena { padding: 12px 8px 14px; gap: 12px; }
            .train-stage { min-height: 155px; }
            .train-consist { gap: 4px; }
            .locomotive { width: 92px; height: 96px; }
            .smokestack { width: 18px; height: 20px; left: 16px; }
            .engine-body { height: 74px; border-width: 3px; border-radius: 18px 14px 10px 10px; }
            .picture-window { width: 64px; height: 58px; font-size: 2.35rem; border-width: 3px; border-radius: 12px; }
            .coupler { width: 6px; height: 6px; margin-bottom: 16px; }
            .letter-car { width: 52px; height: 68px; font-size: 1.85rem; border-width: 3px; border-radius: 12px; }
            .wheel { width: 18px; height: 18px; border-width: 3px; }
            .car-wheels { bottom: -11px; }
            .crate-slot { height: 74px; }
            .letter-crate { width: 70px; height: 68px; font-size: 1.95rem; }
        }

        body.force-landscape { padding: 0; overflow: hidden; }
        body.force-landscape .game-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            max-width: 100vh;
            height: 100vw;
            max-height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
            border-radius: 0;
            overflow-y: auto;
            padding: 12px 18px;
            gap: 10px;
        }

        /* Progress Bar */
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-track {
            flex: 1;
            height: 18px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .progress-text {
            font-weight: 800;
            font-size: 0.98rem;
            color: var(--text-muted);
            min-width: 60px;
            text-align: right;
        }

        /* =========================================
           UNIFIED TRAIN STATION ARENA
           ========================================= */
        .station-arena {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 68%, #dcfce7 68%, #bbf7d0 100%);
            border: 4px solid #38bdf8;
            border-radius: 30px;
            padding: 16px 18px 18px;
            position: relative;
            overflow: hidden;
        }

        .arena-hint {
            font-size: 1.05rem;
            font-weight: 800;
            color: #0369a1;
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid #7dd3fc;
            padding: 6px 18px;
            border-radius: 999px;
            text-align: center;
        }

        /* Train Track & Moving Train Stage */
        .train-stage {
            position: relative;
            width: 100%;
            min-height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 14px;
        }

        .train-consist {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: clamp(8px, 1.8vw, 14px);
            position: relative;
            z-index: 4;
            animation: trainIdleChug 2.2s ease-in-out infinite;
        }

        .train-consist.entering {
            animation: trainEnterStation 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .train-consist.departing {
            animation: trainExitStation 0.95s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
        }

        @keyframes trainEnterStation {
            0% { transform: translateX(920px); }
            82% { transform: translateX(-10px); }
            100% { transform: translateX(0px); }
        }

        @keyframes trainExitStation {
            0% { transform: translateX(0px); }
            15% { transform: translateX(12px); }
            100% { transform: translateX(-980px); }
        }

        @keyframes trainIdleChug {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        /* Locomotive Engine (Left Front with Picture Clue) */
        .locomotive {
            position: relative;
            width: clamp(136px, 26vw, 174px);
            height: clamp(128px, 24vw, 156px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* Smokestack & Puff */
        .smokestack {
            position: absolute;
            top: 2px;
            left: 26px;
            width: 26px;
            height: 30px;
            background: #334155;
            border: 3px solid #0f172a;
            border-radius: 4px 4px 0 0;
        }

        .smoke-puff {
            position: absolute;
            top: -20px;
            left: 20px;
            font-size: 1.65rem;
            opacity: 0.75;
            animation: smokeFloat 2.2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes smokeFloat {
            0% { transform: translateY(0) scale(0.7); opacity: 0.85; }
            100% { transform: translateY(-22px) translateX(14px) scale(1.25); opacity: 0; }
        }

        .engine-body {
            position: relative;
            width: 100%;
            height: 108px;
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border: 4px solid #991b1b;
            border-radius: 26px 18px 12px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #7f1d1d;
        }

        /* Bigger Picture Clue Window on Locomotive */
        .picture-window {
            width: 92px;
            height: 84px;
            background: #fefce8;
            border: 4px solid #facc15;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 7vw, 3.85rem);
            line-height: 1;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.12);
        }

        /* Coupler Bar Between Cars */
        .coupler {
            width: 12px;
            height: 9px;
            background: #334155;
            border-radius: 4px;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        /* Bigger Letter Train Car */
        .letter-car {
            position: relative;
            width: clamp(78px, 16vw, 106px);
            height: clamp(96px, 19vw, 122px);
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 4px solid #0369a1;
            border-radius: 18px 18px 12px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2.5rem, 6.2vw, 3.5rem);
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 5px 0 #075985;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        }

        /* Glowing Empty '?' Car Drop Target */
        .letter-car.missing-slot {
            background: #fefce8;
            border: 4px dashed #ea580c;
            color: #ea580c;
            text-shadow: none;
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.15);
            animation: slotPulse 2s ease-in-out infinite;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
        }

        @keyframes slotPulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15); }
            50% { box-shadow: 0 0 0 8px rgba(234, 88, 12, 0.32); }
        }

        .letter-car.missing-slot.drag-over {
            transform: scale(1.14);
            border-style: solid;
            background: #fef08a;
            animation: none;
        }

        .letter-car.solved-car {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            border: 4px solid #15803d;
            color: #ffffff;
            box-shadow: 0 4px 0 #14532d;
            animation: none;
        }

        .letter-car.wrong-drop {
            background: #fee2e2;
            border-color: var(--error-red-dark);
            color: var(--error-red-dark);
            animation: shakeHorizontal 0.4s ease;
        }

        /* Train Wheels Row */
        .car-wheels {
            position: absolute;
            bottom: -16px;
            left: 10%;
            right: 10%;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .wheel {
            width: 26px;
            height: 26px;
            background: #1e293b;
            border: 4px solid #94a3b8;
            border-radius: 50%;
        }

        /* Wooden & Steel Railway Track */
        .railway-track {
            width: 100%;
            height: 14px;
            background: repeating-linear-gradient(
                90deg,
                #78350f 0px,
                #78350f 18px,
                transparent 18px,
                transparent 34px
            );
            border-top: 4px solid #475569;
            margin-top: 14px;
            border-radius: 4px;
        }

        /* =========================================
           4 DRAGGABLE CARGO LETTER CRATES
           ========================================= */
        .crates-dock {
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            border-top: 2px solid rgba(56, 189, 248, 0.35);
            border-radius: 22px;
            padding: 14px 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        @media (min-width: 600px) {
            .crates-dock {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .crate-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 86px;
        }

        .letter-crate {
            position: relative;
            width: 84px;
            height: 82px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            font-weight: 900;
            cursor: grab;
            touch-action: none;
            animation: crateBob 2.6s ease-in-out infinite;
            transition: transform 0.15s ease;
        }

        .crate-slot:nth-child(1) .letter-crate {
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%);
            border: 4px solid #fef08a;
            box-shadow: 0 7px 0 #a16207;
            color: #422006;
            animation-delay: 0s;
        }
        .crate-slot:nth-child(2) .letter-crate {
            background: linear-gradient(180deg, #c084fc 0%, #9333ea 100%);
            border: 4px solid #f3e8ff;
            box-shadow: 0 7px 0 #6b21a8;
            color: #ffffff;
            animation-delay: 0.4s;
        }
        .crate-slot:nth-child(3) .letter-crate {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            border: 4px solid #ffedd5;
            box-shadow: 0 7px 0 #9a3412;
            color: #ffffff;
            animation-delay: 0.8s;
        }
        .crate-slot:nth-child(4) .letter-crate {
            background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
            border: 4px solid #fce7f3;
            box-shadow: 0 7px 0 #9d174d;
            color: #ffffff;
            animation-delay: 1.2s;
        }

        @keyframes crateBob {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }

        .letter-crate:hover:not(.dragging):not(.wrong):not(.disabled) {
            transform: translateY(-7px) scale(1.06);
            animation-play-state: paused;
        }

        .letter-crate.dragging {
            position: fixed;
            margin: 0;
            z-index: 9999;
            cursor: grabbing;
            animation: none !important;
            transform: scale(1.12) rotate(-5deg);
            box-shadow: 0 20px 32px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        .letter-crate.wrong {
            background: #fee2e2 !important;
            border-color: var(--error-red) !important;
            box-shadow: 0 4px 0 var(--error-red) !important;
            color: var(--error-red-dark) !important;
            opacity: 0.45;
            cursor: not-allowed;
            animation: none;
        }

        .letter-crate.disabled {
            pointer-events: none;
        }

        .letter-crate.snap-wobble {
            animation: shakeHorizontal 0.4s ease !important;
        }

        @keyframes shakeHorizontal {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Celebration Trophy Screen */
        .celebration-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            padding: 24px 12px;
        }

        .celebration-screen.active {
            display: flex;
        }

        .trophy-icon {
            font-size: 6rem;
            filter: drop-shadow(0 10px 15px rgba(234, 179, 8, 0.4));
            animation: trophyFloat 2s ease-in-out infinite;
        }

        @keyframes trophyFloat {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .celebration-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--train-blue-dark);
        }

        .celebration-stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .final-stat-box {
            background: #f0f9ff;
            border: 3px solid #bae6fd;
            border-radius: 20px;
            padding: 16px 24px;
            min-width: 140px;
        }

        .final-stat-val {
            font-size: 2rem;
            font-weight: 900;
            color: var(--train-red-dark);
        }

        .final-stat-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .play-again-btn {
            background: var(--success-green);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 18px 40px;
            font-size: 1.45rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            box-shadow: var(--shadow-btn) var(--success-green-dark);
            transition: all 0.15s ease;
        }

        .play-again-btn:hover {
            transform: translateY(-3px);
            background: #16a34a;
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Decorative Clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- Confetti Overlay -->
    <canvas id="confetti-canvas"></canvas>

    <!-- MAIN CENTERED GAME CARD -->
    <main class="game-container">

        <!-- Header Bar -->
        <header class="header-bar">
            <div class="mode-selector" role="group" aria-label="Grade Level">
                <button class="mode-btn active" id="btn-grade1" onclick="setGrade(1)">🌟 Grade 1</button>
                <button class="mode-btn" id="btn-grade2" onclick="setGrade(2)">🚀 Grade 2</button>
            </div>

            <div class="controls-group">
                <div class="stat-badge" title="Stars">
                    <span>⭐</span>
                    <span id="star-count">0</span>
                </div>
                <div class="stat-badge streak-badge" title="Streak">
                    <span>🔥</span>
                    <span id="streak-count">0</span>
                </div>
                <button class="icon-btn" id="rotate-btn" onclick="toggleLandscapeMode()" title="Rotate Screen" aria-label="Rotate Screen">
                    🔄
                </button>
                <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="Sound">
                    🔊
                </button>
            </div>
        </header>

        <!-- Progress Bar -->
        <div class="progress-wrapper" id="progress-section">
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">1 / 10</div>
        </div>

        <!-- Active Gameplay Area -->
        <section id="play-area" style="display: flex; flex-direction: column; gap: 16px;">

            <!-- Unified Train Station Arena -->
            <div class="station-arena">
                <div class="arena-hint">Drag the missing letter into the train car! 🚂🔤</div>

                <!-- Train Consist on Track -->
                <div class="train-stage">
                    <div class="train-consist" id="train-consist">
                        <!-- Rendered dynamically with Locomotive + Letter Cars -->
                    </div>
                    <div class="railway-track"></div>
                </div>

                <!-- 4 Draggable Letter Crates -->
                <div class="crates-dock" id="crates-dock">
                    <!-- 4 draggable letter blocks rendered dynamically -->
                </div>
            </div>

        </section>

        <!-- End-of-Round Celebration Trophy Screen -->
        <section class="celebration-screen" id="celebration-screen">
            <div class="trophy-icon">🏆</div>
            <h1 class="celebration-title">All Aboard! Great Job!</h1>

            <div class="celebration-stats">
                <div class="final-stat-box">
                    <div class="final-stat-val" id="final-stars">10 ⭐</div>
                    <div class="final-stat-label">Stars</div>
                </div>
                <div class="final-stat-box">
                    <div class="final-stat-val" id="final-streak">5 🔥</div>
                    <div class="final-stat-label">Streak</div>
                </div>
            </div>

            <button class="play-again-btn" onclick="startNewRound()">
                Ride Again! 🚂
            </button>
        </section>

    </main>

    <script>
        /* =========================================
           WORD BANKS (GRADE 1 CVC & GRADE 2 BLENDS)
           ========================================= */
        const grade1Words = [
            { word: 'CAT', emoji: '🐱', missingIdx: 1 },
            { word: 'DOG', emoji: '🐶', missingIdx: 1 },
            { word: 'SUN', emoji: '☀️', missingIdx: 1 },
            { word: 'PIG', emoji: '🐷', missingIdx: 0 },
            { word: 'BUS', emoji: '🚌', missingIdx: 1 },
            { word: 'HAT', emoji: '🎩', missingIdx: 2 },
            { word: 'FOX', emoji: '🦊', missingIdx: 0 },
            { word: 'BEE', emoji: '🐝', missingIdx: 0 },
            { word: 'BUG', emoji: '🐞', missingIdx: 1 },
            { word: 'CUP', emoji: '🥤', missingIdx: 2 },
            { word: 'HEN', emoji: '🐔', missingIdx: 1 },
            { word: 'OWL', emoji: '🦉', missingIdx: 0 }
        ];

        const grade2Words = [
            { word: 'FROG', emoji: '🐸', missingIdx: 1 },
            { word: 'STAR', emoji: '⭐', missingIdx: 2 },
            { word: 'FISH', emoji: '🐟', missingIdx: 1 },
            { word: 'DUCK', emoji: '🦆', missingIdx: 2 },
            { word: 'CAKE', emoji: '🎂', missingIdx: 1 },
            { word: 'BOAT', emoji: '⛵', missingIdx: 2 },
            { word: 'TREE', emoji: '🌳', missingIdx: 1 },
            { word: 'LION', emoji: '🦁', missingIdx: 0 },
            { word: 'BEAR', emoji: '🐻', missingIdx: 2 },
            { word: 'MOON', emoji: '🌙', missingIdx: 1 },
            { word: 'CRAB', emoji: '🦀', missingIdx: 1 },
            { word: 'SHIP', emoji: '🚢', missingIdx: 2 }
        ];

        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

        /* =========================================
           GAME STATE & CONFIGURATION
           ========================================= */
        const state = {
            grade: 1,
            stars: 0,
            streak: 0,
            bestStreak: 0,
            questionIndex: 0,
            totalQuestions: 10,
            wordPool: [],
            currentItem: null,
            targetLetter: 'A',
            isSolved: false,
            isMuted: false
        };

        const dom = {
            btnGrade1: document.getElementById('btn-grade1'),
            btnGrade2: document.getElementById('btn-grade2'),
            starCount: document.getElementById('star-count'),
            streakCount: document.getElementById('streak-count'),
            muteBtn: document.getElementById('mute-btn'),
            progressSection: document.getElementById('progress-section'),
            progressFill: document.getElementById('progress-fill'),
            progressText: document.getElementById('progress-text'),
            playArea: document.getElementById('play-area'),
            trainConsist: document.getElementById('train-consist'),
            cratesDock: document.getElementById('crates-dock'),
            celebrationScreen: document.getElementById('celebration-screen'),
            finalStars: document.getElementById('final-stars'),
            finalStreak: document.getElementById('final-streak')
        };

        /* =========================================
           WEB AUDIO SYNTHESIZER (NO EXTERNAL FILES)
           ========================================= */
        let audioCtx = null;

        function ensureAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type = 'sine', duration = 0.15, delay = 0, volume = 0.2) {
            if (state.isMuted) return;
            ensureAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + duration + 0.02);
        }

        function playPickupSound() {
            playTone(460, 'sine', 0.09, 0, 0.15);
            playTone(600, 'sine', 0.1, 0.04, 0.15);
        }

        function playTrainWhistle() {
            // Classic two-tone "Choo-Choo!" train whistle
            playTone(587.33, 'triangle', 0.22, 0, 0.24);
            playTone(739.99, 'triangle', 0.22, 0, 0.18);
            playTone(587.33, 'triangle', 0.36, 0.28, 0.26);
            playTone(739.99, 'triangle', 0.36, 0.28, 0.2);
        }

        function playWrongBuzz() {
            playTone(230, 'sawtooth', 0.15, 0, 0.14);
            playTone(175, 'sawtooth', 0.2, 0.12, 0.14);
        }

        function playVictoryFanfare() {
            const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
            const times = [0, 0.12, 0.24, 0.36, 0.54, 0.68];
            notes.forEach((n, i) => playTone(n, 'triangle', 0.25, times[i], 0.25));
        }

        function toggleMute() {
            state.isMuted = !state.isMuted;
            dom.muteBtn.textContent = state.isMuted ? '🔇' : '🔊';
            if (!state.isMuted) playPickupSound();
        }

        async function toggleLandscapeMode() {
            const isForced = document.body.classList.contains('force-landscape');
            if (!isForced) {
                try {
                    if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                        await document.documentElement.requestFullscreen();
                    }
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape');
                        return;
                    }
                } catch (err) {}
                document.body.classList.add('force-landscape');
            } else {
                document.body.classList.remove('force-landscape');
                try {
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                    if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
                } catch (err) {}
            }
        }

        /* =========================================
           GRADE & WORD GENERATION
           ========================================= */
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function setGrade(gradeLevel) {
            state.grade = gradeLevel;
            dom.btnGrade1.classList.toggle('active', gradeLevel === 1);
            dom.btnGrade2.classList.toggle('active', gradeLevel === 2);
            playPickupSound();
            startNewRound();
        }

        function startNewRound() {
            state.questionIndex = 0;
            state.streak = 0;
            const bank = state.grade === 1 ? grade1Words : grade2Words;
            state.wordPool = shuffleArray(bank).slice(0, state.totalQuestions);

            updateStatsUI();
            dom.celebrationScreen.classList.remove('active');
            dom.playArea.style.display = 'flex';
            dom.progressSection.style.display = 'flex';
            nextQuestion();
        }

        function generateLetterOptions(correctLetter) {
            const vowels = ['A', 'E', 'I', 'O', 'U'];
            const isVowel = vowels.includes(correctLetter);
            const distractorSource = isVowel ? vowels : alphabet;

            const choices = new Set([correctLetter]);
            while (choices.size < 4) {
                const randomChar = distractorSource[Math.floor(Math.random() * distractorSource.length)];
                if (randomChar !== correctLetter) {
                    choices.add(randomChar);
                }
            }
            return shuffleArray(Array.from(choices));
        }

        function nextQuestion() {
            if (state.questionIndex >= state.totalQuestions) {
                showCelebration();
                return;
            }

            state.isSolved = false;
            state.currentItem = state.wordPool[state.questionIndex];
            state.targetLetter = state.currentItem.word[state.currentItem.missingIdx];

            // Update progress bar
            const pct = (state.questionIndex / state.totalQuestions) * 100;
            dom.progressFill.style.width = `${pct}%`;
            dom.progressText.textContent = `${state.questionIndex + 1} / ${state.totalQuestions}`;

            renderTrain();
            renderLetterCrates();

            // Roll train into the station from the right!
            dom.trainConsist.classList.remove('departing', 'entering');
            void dom.trainConsist.offsetWidth;
            dom.trainConsist.classList.add('entering');
            setTimeout(() => {
                dom.trainConsist.classList.remove('entering');
            }, 860);
        }

        function renderTrain() {
            dom.trainConsist.innerHTML = '';

            // 1. Locomotive Engine with Emoji Picture Clue
            const loco = document.createElement('div');
            loco.className = 'locomotive';
            loco.innerHTML = `
                <div class="smoke-puff">💨</div>
                <div class="smokestack"></div>
                <div class="engine-body">
                    <div class="picture-window">${state.currentItem.emoji}</div>
                </div>
                <div class="car-wheels">
                    <div class="wheel"></div>
                    <div class="wheel"></div>
                </div>
            `;
            dom.trainConsist.appendChild(loco);

            // 2. Letter Cars Coupled Behind the Engine
            const letters = state.currentItem.word.split('');
            letters.forEach((char, idx) => {
                const coupler = document.createElement('div');
                coupler.className = 'coupler';
                dom.trainConsist.appendChild(coupler);

                const car = document.createElement('div');
                if (idx === state.currentItem.missingIdx) {
                    car.className = 'letter-car missing-slot';
                    car.id = 'drop-train-car';
                    car.textContent = '?';
                } else {
                    car.className = 'letter-car';
                    car.textContent = char;
                }

                const wheels = document.createElement('div');
                wheels.className = 'car-wheels';
                wheels.innerHTML = '<div class="wheel"></div><div class="wheel"></div>';
                car.appendChild(wheels);

                dom.trainConsist.appendChild(car);
            });
        }

        function renderLetterCrates() {
            dom.cratesDock.innerHTML = '';
            const options = generateLetterOptions(state.targetLetter);

            options.forEach((letter) => {
                const slot = document.createElement('div');
                slot.className = 'crate-slot';

                const crate = document.createElement('div');
                crate.className = 'letter-crate';
                crate.textContent = letter;

                setupCrateDrag(crate, letter);
                slot.appendChild(crate);
                dom.cratesDock.appendChild(slot);
            });
        }

        /* =========================================
           POINTER DRAG & DROP CRATE TO TRAIN CAR
           ========================================= */
        function isOverTrainCar(crateRect) {
            const dropCar = document.getElementById('drop-train-car');
            if (!dropCar) return false;
            const targetRect = dropCar.getBoundingClientRect();
            const pad = 22;
            return !(
                crateRect.right < targetRect.left - pad ||
                crateRect.left > targetRect.right + pad ||
                crateRect.bottom < targetRect.top - pad ||
                crateRect.top > targetRect.bottom + pad
            );
        }

        function setupCrateDrag(crateEl, letter) {
            let isDragging = false;
            let hasMoved = false;
            let startX = 0;
            let startY = 0;
            let offsetX = 0;
            let offsetY = 0;

            const onPointerDown = (e) => {
                if (state.isSolved || crateEl.classList.contains('wrong') || crateEl.classList.contains('disabled')) {
                    return;
                }
                e.preventDefault();
                ensureAudio();

                const rect = crateEl.getBoundingClientRect();
                isDragging = true;
                hasMoved = false;
                startX = e.clientX;
                startY = e.clientY;
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;

                crateEl.setPointerCapture(e.pointerId);
                crateEl.addEventListener('pointermove', onPointerMove);
                crateEl.addEventListener('pointerup', onPointerUp);
                crateEl.addEventListener('pointercancel', onPointerUp);
            };

            const onPointerMove = (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                // Require deliberate drag (> 8px) so clicks never submit
                if (!hasMoved && Math.hypot(dx, dy) > 8) {
                    hasMoved = true;
                    const rect = crateEl.getBoundingClientRect();
                    crateEl.style.width = `${rect.width}px`;
                    crateEl.style.height = `${rect.height}px`;
                    crateEl.classList.add('dragging');
                    playPickupSound();
                }

                if (hasMoved) {
                    if (document.body.classList.contains('force-landscape')) {
                        const w = crateEl.offsetWidth;
                        const h = crateEl.offsetHeight;
                        crateEl.style.left = `${e.clientY - w / 2}px`;
                        crateEl.style.top = `${window.innerWidth - e.clientX - h / 2}px`;
                    } else {
                        crateEl.style.left = `${e.clientX - offsetX}px`;
                        crateEl.style.top = `${e.clientY - offsetY}px`;
                    }

                    const dropCar = document.getElementById('drop-train-car');
                    if (dropCar) {
                        if (isOverTrainCar(crateEl.getBoundingClientRect())) {
                            dropCar.classList.add('drag-over');
                        } else {
                            dropCar.classList.remove('drag-over');
                        }
                    }
                }
            };

            const onPointerUp = (e) => {
                if (!isDragging) return;
                isDragging = false;

                crateEl.removeEventListener('pointermove', onPointerMove);
                crateEl.removeEventListener('pointerup', onPointerUp);
                crateEl.removeEventListener('pointercancel', onPointerUp);

                const droppedInCar = hasMoved && isOverTrainCar(crateEl.getBoundingClientRect());
                const dropCar = document.getElementById('drop-train-car');
                if (dropCar) dropCar.classList.remove('drag-over');

                crateEl.classList.remove('dragging');
                crateEl.style.width = '';
                crateEl.style.height = '';
                crateEl.style.left = '';
                crateEl.style.top = '';

                if (droppedInCar) {
                    evaluateLetter(letter, crateEl);
                } else {
                    crateEl.classList.remove('snap-wobble');
                    void crateEl.offsetWidth;
                    crateEl.classList.add('snap-wobble');
                    setTimeout(() => crateEl.classList.remove('snap-wobble'), 420);
                }
            };

            crateEl.addEventListener('pointerdown', onPointerDown);
        }

        /* =========================================
           LETTER EVALUATION & TRAIN DEPARTURE
           ========================================= */
        function evaluateLetter(selectedLetter, crateEl) {
            if (state.isSolved) return;

            const dropCar = document.getElementById('drop-train-car');

            if (selectedLetter === state.targetLetter) {
                state.isSolved = true;
                state.stars += 1;
                state.streak += 1;
                if (state.streak > state.bestStreak) state.bestStreak = state.streak;
                updateStatsUI();

                playTrainWhistle();
                launchConfetti(60);

                if (dropCar) {
                    dropCar.className = 'letter-car solved-car';
                    dropCar.childNodes[0].textContent = selectedLetter;
                }

                document.querySelectorAll('.letter-crate').forEach((c) => c.classList.add('disabled'));

                // Chug train forward off the station track!
                setTimeout(() => {
                    dom.trainConsist.classList.add('departing');
                }, 450);

                state.questionIndex += 1;
                const pct = (state.questionIndex / state.totalQuestions) * 100;
                dom.progressFill.style.width = `${pct}%`;

                setTimeout(() => {
                    nextQuestion();
                }, 1500);
            } else {
                state.streak = 0;
                updateStatsUI();
                playWrongBuzz();

                crateEl.classList.add('wrong', 'disabled');
                if (dropCar) {
                    dropCar.classList.add('wrong-drop');
                    setTimeout(() => dropCar.classList.remove('wrong-drop'), 420);
                }
            }
        }

        function updateStatsUI() {
            dom.starCount.textContent = state.stars;
            dom.streakCount.textContent = state.streak;
        }

        function showCelebration() {
            playVictoryFanfare();
            launchConfetti(140);

            dom.playArea.style.display = 'none';
            dom.progressSection.style.display = 'none';
            dom.celebrationScreen.classList.add('active');

            dom.finalStars.textContent = `${state.stars} ⭐`;
            dom.finalStreak.textContent = `${state.bestStreak} 🔥`;
        }

        /* =========================================
           CONFETTI PARTICLE SYSTEM
           ========================================= */
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let particles = [];
        let animId = null;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function launchConfetti(count = 60) {
            const colors = ['#facc15', '#38bdf8', '#22c55e', '#ef4444', '#a855f7', '#fb923c'];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: confettiCanvas.width * (0.2 + Math.random() * 0.6),
                    y: confettiCanvas.height * 0.35,
                    vx: (Math.random() - 0.5) * 14,
                    vy: -Math.random() * 12 - 4,
                    size: Math.random() * 9 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 12
                });
            }
            if (!animId) animateConfetti();
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.35;
                p.vx *= 0.99;
                p.rotation += p.vRot;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
                ctx.restore();
            });

            particles = particles.filter((p) => p.y < confettiCanvas.height + 30);
            if (particles.length > 0) {
                animId = requestAnimationFrame(animateConfetti);
            } else {
                animId = null;
            }
        }

        /* =========================================
           INITIALIZE GAME ON LOAD
           ========================================= */
        window.addEventListener('DOMContentLoaded', () => {
            startNewRound();
        });
    </script>
